# Local development services for the proposal stack (M01). Start: `pnpm infra:up` (waits for health checks).
# Stop: `pnpm infra:down`; wipe data: `pnpm infra:reset`. Values come from infra/local-dev.env (local only).
# Images are pinned by tag and digest. Docker Hub images are pulled through mirror.gcr.io (Google's public
# Docker Hub mirror) because anonymous Docker Hub pulls are rate-limited in shared environments.
name: agentcity

services:
  postgres:
    # PostgreSQL 17 with ParadeDB pg_search (BM25) and pgvector.
    image: mirror.gcr.io/paradedb/paradedb:0.26.3-pg17@sha256:950f68abebc78e28fd2ecfc8ed915aa29d07b5dd8cba25b2f513ca4e211dda70
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_USER: ${APP_DB_USER}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ['127.0.0.1:${PG_PORT}:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: mirror.gcr.io/library/redis:7.4-alpine@sha256:6ba19c50b56777f5c11c58eff8ddb69d0d5f27ba131cffb63f180ccfd43c66af
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT}:6379']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 3s
      timeout: 3s
      retries: 20

  object-storage:
    # S3-compatible storage. RustFS replaces MinIO here: MinIO's images are no longer published (see
    # planning/agentcity-migration/m01/ARCHITECTURE.md, ADR-004). Code uses the standard S3 API only.
    image: mirror.gcr.io/rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports: ['127.0.0.1:${S3_PORT}:9000', '127.0.0.1:${S3_CONSOLE_PORT}:9001']
    volumes: [s3data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health >/dev/null']
      interval: 3s
      timeout: 3s
      retries: 40

  temporal:
    # Temporal CLI development server with a file-backed store (persists across restarts in its volume).
    image: mirror.gcr.io/temporalio/temporal:1.9.1@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    command: ['server', 'start-dev', '--ip', '0.0.0.0', '--db-filename', '/data/temporal.db', '--ui-port', '8233']
    ports: ['127.0.0.1:${TEMPORAL_PORT}:7233', '127.0.0.1:${TEMPORAL_UI_PORT}:8233']
    volumes: [temporaldata:/data]
    user: root
    healthcheck:
      test: ['CMD-SHELL', 'temporal operator cluster health --address localhost:7233 | grep -q SERVING']
      interval: 3s
      timeout: 5s
      retries: 40

  mail:
    # Local mail sink (M03): Keycloak's email sign-in codes land here and never leave the machine.
    # Its web UI/API is for tests and developers: http://127.0.0.1:${MAIL_UI_PORT}
    image: mirror.gcr.io/axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68
    ports: ['127.0.0.1:${MAIL_UI_PORT}:8025']
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 3s
      timeout: 3s
      retries: 20

  keycloak:
    # OIDC provider (M03 sign-in flows; realm in ./keycloak, first-party providers built into ./keycloak/providers).
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ['start-dev', '--import-realm', '--health-enabled=true']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports: ['127.0.0.1:${KEYCLOAK_PORT}:8080', '127.0.0.1:${KEYCLOAK_MGMT_PORT}:9000']
    volumes:
      - ./keycloak/agentcity-realm.json:/opt/keycloak/data/import/agentcity-realm.json:ro
      - ./keycloak/providers:/opt/keycloak/providers:ro
    depends_on:
      mail:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"
      interval: 5s
      timeout: 5s
      retries: 60

volumes:
  pgdata:
  redisdata:
  s3data:
  temporaldata:
