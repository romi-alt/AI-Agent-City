# AgentCity email copy (X01). MessageFormat rules apply: write an apostrophe as two ('').
# Plain, factual wording: what the email is for, what to do, when the link or code stops working.

# The email check (template email-verification.ftl). Its subject is shared by every email-check email: demo requests
# and a first sign-in through agency SSO use the same Keycloak template, so the subject must be true for both.
emailVerificationSubject=Confirm your email for AgentCity
acVerifyHeading=Confirm your email
acVerifyDemoPreheader=One click to open your AgentCity demo office.
acVerifyPreheader=Confirm your email address to finish signing in to AgentCity.
acVerifyDemoIntro=You asked for an AgentCity demo. Confirm that this is your email address, then sign in to open your demo office.
acVerifyIntro=Confirm that this is your email address to finish signing in to AgentCity.
acVerifyButton=Confirm my email
acVerifyExpiry=The link works once and expires in {0}.
acVerifyDemoIgnore=If you did not ask for a demo, you can ignore this email. Nobody can sign in with this address until it is confirmed.
acVerifyIgnore=If this was not you, you can ignore this email.
acLinkFallback=If the button does not work, paste this link into your browser:

# Admin-issued actions (template executeActions.ftl), e.g. passkey enrolment. One subject for every such email.
executeActionsSubject=Finish setting up your AgentCity sign-in
acActionsHeading=Finish setting up your sign-in
acActionsIntro=An AgentCity administrator asked you to: {0}.
acActionsButton=Continue
acActionsExpiry=The link works once and expires in {0}.
acActionsIgnore=If you were not expecting this, you can ignore this email. Nothing changes unless you open the link.
requiredAction.VERIFY_EMAIL=confirm your email address
requiredAction.webauthn-register-passwordless=set up a passkey
requiredAction.webauthn-register=set up a security key
requiredAction.UPDATE_PROFILE=update your profile

# The sign-in code (provider agentcity-email-code; its subject key is agentcityEmailCodeSubject).
agentcityEmailCodeSubject=Your AgentCity sign-in code
acCodePreheader=Your one-time code to sign in to AgentCity.
acCodeHeading=Your sign-in code
acCodeIntro=Enter this code on the AgentCity sign-in page:
acCodeExpiry=The code works once, for {0}.
acCodeIgnore=If you did not try to sign in, you can ignore this email. Nobody can sign in without the code.
acOneMinute=1 minute
acMinutes={0} minutes

acEmailFooter=Sent by AgentCity to the email address on your AgentCity sign-in.
