# AgentCity login theme (X01). Extends Keycloak's keycloak.v2 theme: the page templates, scripts and PatternFly
# stay upstream; template.ftl (layout and wordmark), info.ftl (auto-continue after the demo email check) and the
# email-code page are ours, and css/agentcity.css restyles everything to the landing page's tokens.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/agentcity.css
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css

# Light only, like the landing page.
darkMode=false

kcLogin=pf-v5-c-login ac-login
kcBodyClass=ac-body
