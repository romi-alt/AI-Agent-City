# AgentCity email sign-in code (agentcity-email-code). Messages go through java.text.MessageFormat:
# write an apostrophe as two ('') or avoid it.
agentcityEmailCodeTitle=Check your email
agentcityEmailCodeSent=We sent a {0}-digit code to {1}. It works for {2}.
agentcityEmailCodeSentNoAddress=We sent a {0}-digit code to the email address on this account. It works for {2}.
agentcityEmailCodeLabel=Sign-in code
agentcityEmailCodeSubmit=Sign in
agentcityEmailCodeResend=Send a new code
agentcityEmailCodeHelp=No email? Check your spam folder, then send a new code. If it still does not arrive, ask your administrator to confirm your email address.
agentcityEmailCodeMissing=Enter the code from the email.
agentcityEmailCodeInvalid=That code is not right. Tries left for this code: {0}.
agentcityEmailCodeTooManyAttempts=Too many wrong codes. Send a new code to try again.
agentcityEmailCodeExpired=That code has expired. Send a new code to try again.
agentcityEmailCodeNoCode=Send a code to sign in.
agentcityEmailCodeCooldown=Please wait {0} seconds before asking for another code.
agentcityEmailCodeResent=We sent a new code. Earlier codes no longer work.
agentcityEmailCodeSendLimit=You have asked for the maximum number of codes. Start signing in again to get another.
agentcityEmailCodeSendFailed=We could not send the email just now. Try again in a moment.
agentcityEmailCodeUnavailable=Sign-in with a code is not possible right now. Wait a few minutes, then start again.
agentcityEmailCodeSubject=Your sign-in code for {0}
agentcityEmailCodeBodyIntro=Use this code to sign in to {0}:
agentcityEmailCodeBodyExpiry=The code works for {0} and only once.
agentcityEmailCodeOneMinute=1 minute
agentcityEmailCodeMinutes={0} minutes
agentcityEmailCodeBodyIgnore=If you did not try to sign in, you can ignore this email. Nobody can sign in without the code.
